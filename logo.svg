<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <defs>
    <!-- Teal Chilled Gradient -->
    <linearGradient id="chillTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#0e7c7b" />
      <stop offset="100%" stop-color="#073338" />
    </linearGradient>
    
    <!-- Citrus Orange Accent -->
    <linearGradient id="citrusGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9e00" />
      <stop offset="100%" stop-color="#e8590c" />
    </linearGradient>

    <!-- Frost Ice Gradient -->
    <linearGradient id="iceFrost" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c9f1ee" stop-opacity="0.3" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0e7c7b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- LOGO ICON / EMBLEM (Left: 0 to 56) -->
  <g transform="translate(4, 4)" filter="url(#softGlow)">
    <!-- Outer Ice Crystal Hexagon / Shield -->
    <rect x="2" y="2" width="52" height="52" rx="16" fill="url(#chillTeal)" />
    <rect x="3.5" y="3.5" width="49" height="49" rx="14.5" stroke="url(#iceFrost)" stroke-width="1.5" fill="none" opacity="0.6"/>

    <!-- Chilled Beverage Bottle Silhouette -->
    <path d="M24 12 h8 v4 l2.5 4.5 v21 a3 3 0 0 1 -3 3 h-7 a3 3 0 0 1 -3 -3 v-21 l2.5 -4.5 v-4 z" fill="#ffffff" fill-opacity="0.95" />
    
    <!-- Bottle Neck Band / Crown Cap -->
    <rect x="23.5" y="10" width="9" height="3" rx="1" fill="url(#citrusGlow)" />
    <line x1="21.5" y1="26" x2="34.5" y2="26" stroke="url(#chillTeal)" stroke-width="2" stroke-linecap="round"/>

    <!-- Fizz Effervescence Bubbles -->
    <circle cx="28" cy="34" r="2.2" fill="url(#citrusGlow)" />
    <circle cx="24.5" cy="38" r="1.4" fill="url(#citrusGlow)" />
    <circle cx="31" cy="39" r="1.2" fill="url(#citrusGlow)" />
    <circle cx="27" cy="42" r="1.5" fill="url(#citrusGlow)" />

    <!-- Sparkle / Frost Star in top right -->
    <path d="M42 9 l1.5 3.5 l3.5 1.5 l-3.5 1.5 l-1.5 3.5 l-1.5 -3.5 l-3.5 -1.5 l3.5 -1.5 z" fill="#ffea79" />
  </g>

  <!-- LOGO TYPOGRAPHY / WORDMARK (Right: 68 to 280) -->
  <g transform="translate(68, 14)">
    <!-- "CHILL" in Chilled Teal/Ink -->
    <text x="0" y="24" font-family="'Cabinet Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="-0.03em" fill="#0b2a2e">
      CHILL<tspan fill="url(#citrusGlow)">HUB</tspan>
    </text>

    <!-- Sub-Text Badge: "WHOLESALE BEVERAGES" -->
    <g transform="translate(1, 31)">
      <rect x="0" y="0" width="176" height="15" rx="3" fill="#e7f0ee" />
      <text x="6" y="11" font-family="'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="8.5" letter-spacing="0.18em" fill="#0e7c7b">
        WHOLESALE DISTRIBUTOR
      </text>
      <!-- Small orange dot -->
      <circle cx="168" cy="7.5" r="2.5" fill="url(#citrusGlow)" />
    </g>
  </g>
</svg>
